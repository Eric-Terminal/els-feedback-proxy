openapi: 3.0.3
info:
  title: ELS Feedback & Notification API
  version: 4.0.0
servers:
  - url: https://feedback.els.ericterminal.com
paths:
  /v1/healthz:
    get:
      summary: 健康检查
      responses:
        '200':
          description: ok
  /v1/announcements:
    get:
      summary: 获取已发布的客户端公告
      responses:
        '200':
          description: 公告数组；没有公告时返回空数组
          headers:
            ETag:
              schema:
                type: string
            Cloudflare-CDN-Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicAnnouncement'
        '304':
          description: 公告内容未变化
  /v1/updates/timeline:
    get:
      summary: 获取 ETOS 检查更新时间线
      description: 服务端使用 GitHub 凭据读取固定仓库 dev 分支，并向客户端提供共享缓存后的结构化提交数据。
      responses:
        '200':
          description: 提交时间线
          headers:
            ETag:
              schema:
                type: string
            Cloudflare-CDN-Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTimeline'
        '304':
          description: 时间线内容未变化
        '502':
          description: GitHub 暂时不可用且服务端没有旧缓存
  /v1/guide/token:
    post:
      summary: 获取内置向导临时令牌
      description: 令牌按来源 IP 与当前 30 秒时间窗绑定，不使用 PoW 或设备证明。
      responses:
        '200':
          description: 当前时间窗令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideToken'
  /v1/chat/completions:
    post:
      summary: 使用内置免费向导模型
      description: OpenAI Chat Completions 兼容的流式接口。客户端 model 与 system/developer 消息会被忽略，服务端固定模型并重建向导提示词。
      security:
        - guideToken: []
      parameters:
        - in: header
          name: X-Guide-Session-ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuideChatCompletionRequest'
      responses:
        '200':
          description: 标准 Chat Completions SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: 请求结构或会话 ID 无效
        '401':
          description: 临时令牌无效或过期
        '429':
          description: 同 IP 或同会话已有向导请求生成中
        '502':
          description: 固定上游模型暂时不可用
  /v1/guide/source-trees/{commit_sha}:
    parameters:
      - in: path
        name: commit_sha
        required: true
        schema:
          type: string
          pattern: '^[a-fA-F0-9]{40}$'
    get:
      summary: 获取 ETOS 精确版本的完整源码树
      description: 只查询服务端固定的 ETOS LLM Studio 仓库；结果按不可变 Commit 永久缓存。
      responses:
        '200':
          description: 未截断的源码树
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideSourceTree'
        '304':
          description: 客户端缓存仍然有效
        '400':
          description: Commit SHA 不是完整 40 位哈希
        '502':
          description: GitHub 暂时不可用且没有本地缓存
  /v1/admin/announcements:
    get:
      summary: 获取全部公告管理记录
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      responses:
        '200':
          description: 公告管理记录
        '401':
          description: 管理鉴权失败
    post:
      summary: 创建公告
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementRecordInput'
      responses:
        '201':
          description: 公告已创建
        '400':
          description: 公告字段无效
        '401':
          description: 管理鉴权失败
  /v1/admin/announcements/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
    put:
      summary: 更新公告
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementRecordInput'
      responses:
        '200':
          description: 公告已更新
        '404':
          description: 公告不存在
    delete:
      summary: 删除公告
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      responses:
        '204':
          description: 公告已删除
        '404':
          description: 公告不存在
  /v1/surveys:
    get:
      summary: 获取已发布的意见征集
      responses:
        '200':
          description: 意见征集数组；没有征集时返回空数组
          headers:
            ETag:
              schema:
                type: string
            Cloudflare-CDN-Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicSurvey'
        '304':
          description: 意见征集内容未变化
  /v1/surveys/challenge:
    post:
      summary: 获取匿名答卷提交 challenge
      responses:
        '200':
          description: challenge 已生成，结构与反馈 challenge 相同
  /v1/surveys/{key}/responses:
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
    post:
      summary: 提交匿名答卷
      parameters:
        - in: header
          name: X-ELS-Challenge-Id
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-Timestamp
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-Signature
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-PoW-Nonce
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-PoW-Hash
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyResponseInput'
      responses:
        '201':
          description: 匿名答卷已保存
        '400':
          description: 答卷字段无效
        '401':
          description: 签名、challenge 或 PoW 校验失败
        '410':
          description: 意见征集已停止
        '429':
          description: 触发限流
  /v1/admin/surveys:
    get:
      summary: 获取全部意见征集管理记录
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8521'
      security:
        - announcementAdminToken: []
      responses:
        '200':
          description: 意见征集管理记录
    post:
      summary: 创建意见征集
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8521'
      security:
        - announcementAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyRecordInput'
      responses:
        '201':
          description: 意见征集已创建
        '400':
          description: 意见征集字段无效
  /v1/admin/surveys/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
    put:
      summary: 更新意见征集
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8521'
      security:
        - announcementAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyRecordInput'
      responses:
        '200':
          description: 意见征集已更新
        '409':
          description: 已有答卷，不能修改题目内容
    delete:
      summary: 删除未收到答卷的意见征集
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8521'
      security:
        - announcementAdminToken: []
      responses:
        '204':
          description: 意见征集已删除
        '409':
          description: 已有答卷，不能删除
  /v1/admin/surveys/{key}/results:
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
    get:
      summary: 获取私有匿名答卷
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8521'
      security:
        - announcementAdminToken: []
      responses:
        '200':
          description: 意见征集定义、答卷数量和匿名答卷
        '404':
          description: 意见征集不存在
  /v1/distribution/manifest:
    get:
      summary: 获取已发布的官方数据清单
      responses:
        '200':
          description: 官方数据清单
          headers:
            ETag:
              schema:
                type: string
            Cloudflare-CDN-Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDistributionManifest'
        '304':
          description: 清单内容未变化
  /v1/distribution/files/{checksum}/{file_name}:
    parameters:
      - in: path
        name: checksum
        required: true
        schema:
          type: string
          pattern: '^[a-f0-9]{64}$'
      - in: path
        name: file_name
        required: true
        schema:
          type: string
    get:
      summary: 下载内容寻址的官方文件
      responses:
        '200':
          description: 官方文件内容，响应可长期不可变缓存
        '404':
          description: 文件不存在或已停用
  /v1/admin/distribution:
    get:
      summary: 获取全部官方数据管理记录
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      responses:
        '200':
          description: 官方数据管理记录
        '401':
          description: 管理鉴权失败
    post:
      summary: 上传官方数据
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DistributionUpload'
      responses:
        '201':
          description: 官方数据已创建
        '400':
          description: 表单或文件无效
  /v1/admin/distribution/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
    put:
      summary: 更新官方数据
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DistributionUpdate'
      responses:
        '200':
          description: 官方数据已更新
        '404':
          description: 官方数据不存在
    delete:
      summary: 删除官方数据
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      responses:
        '204':
          description: 官方数据已删除
        '404':
          description: 官方数据不存在
  /v1/admin/distribution/actions:
    get:
      summary: 获取全部官方 Provider 操作
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      responses:
        '200':
          description: Provider 操作管理记录
    post:
      summary: 上传官方 Provider 操作配方
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DistributionActionUpload'
      responses:
        '201':
          description: Provider 操作已创建
        '400':
          description: 配方或合并策略无效
  /v1/admin/distribution/actions/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
    put:
      summary: 更新或停用官方 Provider 操作
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DistributionActionUpdate'
      responses:
        '200':
          description: Provider 操作已更新
        '404':
          description: Provider 操作不存在
    delete:
      summary: 删除官方 Provider 操作
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8081'
      security:
        - announcementAdminToken: []
      responses:
        '204':
          description: Provider 操作已删除
        '404':
          description: Provider 操作不存在
  /v1/telemetry:
    post:
      summary: 上传上一运行周期的 iOS 性能遥测
      description: >-
        接收 MetricKit 原始指标或诊断封装。该接口不使用 PoW、App Attest 或设备标识；
        来源 IP 仅用于进程内限流，不写入遥测文件或持久化状态。
      parameters:
        - in: header
          name: User-Agent
          required: true
          schema:
            type: string
        - in: header
          name: Content-Encoding
          required: false
          description: 仅允许省略或 identity；压缩请求会被拒绝。
          schema:
            type: string
            enum: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryUploadRequest'
      responses:
        '200':
          description: 每条遥测均已持久化或命中持久去重
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryUploadResponse'
        '400':
          description: schema、哈希、时间、元数据或隐私声明无效
        '413':
          description: 请求体超过 4 MiB
        '415':
          description: Content-Type 无效或使用了压缩请求体
        '429':
          description: 触发独立的进程内遥测限流
        '507':
          description: 服务端无法在保留诊断优先级的前提下保存该条遥测
  /v1/admin/telemetry/status:
    get:
      summary: 获取遥测临时存储状态
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8521'
      security:
        - announcementAdminToken: []
      responses:
        '200':
          description: 条数、字节数、分类统计、保留上限与最近接收、清理、确认活动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryStatus'
        '401':
          description: 管理鉴权失败
  /v1/admin/telemetry/manifest:
    get:
      summary: 获取待拉取遥测清单
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8521'
      security:
        - announcementAdminToken: []
      responses:
        '200':
          description: 包含文件大小、文件 SHA-256 与 UTC 日期路径的清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryManifest'
        '401':
          description: 管理鉴权失败
  /v1/admin/telemetry/files/{payload_id}:
    parameters:
      - in: path
        name: payload_id
        required: true
        schema:
          type: string
          pattern: '^[a-f0-9]{64}$'
    get:
      summary: 按 payload_id 导出单个原始遥测文件
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8521'
      security:
        - announcementAdminToken: []
      responses:
        '200':
          description: 原始 TelemetryEnvelope JSON
          headers:
            X-ELS-File-SHA256:
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
        '401':
          description: 管理鉴权失败
        '404':
          description: 文件不存在或已确认删除
  /v1/admin/telemetry/confirm:
    post:
      summary: 精确确认 Mac 已安全落盘的遥测
      servers:
        - url: http://{host}:{port}
          description: 独立管理监听器
          variables:
            host:
              default: 127.0.0.1
            port:
              default: '8521'
      security:
        - announcementAdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload_ids]
              properties:
                payload_ids:
                  type: array
                  minItems: 1
                  maxItems: 512
                  uniqueItems: true
                  items:
                    type: string
                    pattern: '^[a-f0-9]{64}$'
      responses:
        '200':
          description: 已确认删除与未知 ID 列表；重复确认保持幂等
        '400':
          description: 请求体或 payload_id 无效
        '401':
          description: 管理鉴权失败
  /v1/feedback/challenge:
    post:
      summary: 获取 challenge
      responses:
        '200':
          description: challenge 已生成
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  challenge_id:
                    type: string
                  client_secret:
                    type: string
                  nonce:
                    type: string
                  pow_bits:
                    type: integer
                  pow_salt:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
  /v1/feedback/issues:
    post:
      summary: 创建反馈工单
      parameters:
        - in: header
          name: X-ELS-Challenge-Id
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-Timestamp
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-Signature
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-PoW-Nonce
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-PoW-Hash
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  issue_number:
                    type: integer
                  ticket_token:
                    type: string
                  public_url:
                    type: string
                    format: uri
                  status:
                    type: string
        '202':
          description: 已受理但内容被暂时隐藏
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  issue_number:
                    type: integer
                  ticket_token:
                    type: string
                  public_url:
                    type: string
                    format: uri
                  status:
                    type: string
                    enum: [blocked]
                  moderation_blocked:
                    type: boolean
                  moderation_message:
                    type: string
                  archive_id:
                    type: string
        '401':
          description: 签名或 challenge 校验失败
        '429':
          description: 触发限流
  /v1/feedback/issues/{issue_number}:
    get:
      summary: 查询反馈工单状态
      parameters:
        - in: path
          name: issue_number
          required: true
          schema:
            type: integer
        - in: query
          name: ticket_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
        '403':
          description: ticket_token 无效
  /v1/feedback/issues/{issue_number}/comments:
    post:
      summary: 在反馈工单下发送评论
      parameters:
        - in: path
          name: issue_number
          required: true
          schema:
            type: integer
        - in: query
          name: ticket_token
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-Challenge-Id
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-Timestamp
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-Signature
          required: true
          schema:
            type: string
        - in: header
          name: X-ELS-PoW-Nonce
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        '200':
          description: 评论已发布
        '202':
          description: 评论被暂时隐藏，已发布占位评论
        '403':
          description: ticket_token 无效
components:
  securitySchemes:
    announcementAdminToken:
      type: http
      scheme: bearer
      description: 使用 ANNOUNCEMENT_ADMIN_TOKEN；浏览器管理台使用安全会话 Cookie
    guideToken:
      type: http
      scheme: bearer
      description: 通过 /v1/guide/token 获取的 30 秒 IP 绑定临时令牌
  schemas:
    GuideToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    GuideChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          description: 为兼容 OpenAI 客户端保留，服务端会忽略该值。
        stream:
          type: boolean
          description: 服务端始终使用流式响应。
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: true
        tools:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    GuideSourceTree:
      type: object
      required: [schema_version, repository, commit_sha, truncated, entries]
      properties:
        schema_version:
          type: integer
          enum: [1]
        repository:
          type: string
          enum: [Eric-Terminal/ETOS-LLM-Studio]
        commit_sha:
          type: string
          pattern: '^[a-f0-9]{40}$'
        truncated:
          type: boolean
          enum: [false]
        entries:
          type: array
          items:
            type: object
            required: [path, type]
            properties:
              path:
                type: string
              type:
                type: string
                enum: [blob, tree, commit]
              size:
                type: integer
    TelemetryUploadRequest:
      type: object
      additionalProperties: false
      required: [schema_version, envelopes]
      properties:
        schema_version:
          type: integer
          enum: [1, 2]
          description: 必须与批次内所有 envelope 的 schema_version 一致；v1 仅用于兼容已发布客户端，v2 为当前扁平调用栈格式。
        envelopes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/TelemetryEnvelope'
    TelemetryUploadResponse:
      type: object
      required: [schema_version, results]
      properties:
        schema_version:
          type: integer
          enum: [1, 2]
          description: 回显请求使用的 schema_version，确保旧客户端仍能解码响应。
        results:
          type: array
          items:
            type: object
            required: [payload_id, status]
            properties:
              payload_id:
                type: string
                pattern: '^[a-f0-9]{64}$'
              status:
                type: string
                enum: [accepted, duplicate]
    TelemetryEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - payload_id
        - kind
        - captured_at
        - app
        - platform
        - privacy
        - payload
      properties:
        schema_version:
          type: integer
          enum: [1, 2]
        payload_id:
          type: string
          description: 规范化后的 payload JSON 的 SHA-256；v2 对压平后的 payload 计算。
          pattern: '^[a-f0-9]{64}$'
        kind:
          type: string
          enum: [metric, diagnostic]
        captured_at:
          type: string
          format: date-time
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        app:
          type: object
          additionalProperties: false
          required: [version, build, distribution]
          properties:
            version:
              type: string
            build:
              type: string
            distribution:
              type: string
              enum: [testflight, appstore, development, unknown]
        platform:
          type: object
          additionalProperties: false
          required: [name, os_version, device_class, architecture]
          properties:
            name:
              type: string
              enum: [ios]
            os_version:
              type: string
            device_class:
              type: string
            architecture:
              type: string
        privacy:
          type: object
          additionalProperties: false
          required:
            - contains_chat_content
            - contains_request_body
            - contains_response_body
            - contains_credentials
            - contains_user_identifier
          properties:
            contains_chat_content:
              type: boolean
              enum: [false]
            contains_request_body:
              type: boolean
              enum: [false]
            contains_response_body:
              type: boolean
              enum: [false]
            contains_credentials:
              type: boolean
              enum: [false]
            contains_user_identifier:
              type: boolean
              enum: [false]
        payload:
          type: object
          description: v1 为 Apple MetricKit 原始 JSON；v2 要求 `_etos.format` 为 `metric-kit-flat-v1`，并将每个 `callStackTree` 的递归帧转换为带 `frameID`、`parentFrameID` 与 `depth` 的 `callStackFrames` 数组。未知 MetricKit 字段继续保留。
          additionalProperties: true
    TelemetryManifest:
      type: object
      required: [schema_version, generated_at, entries]
      properties:
        schema_version:
          type: integer
          enum: [1]
        generated_at:
          type: string
          format: date-time
        entries:
          type: array
          items:
            type: object
            required:
              - payload_id
              - kind
              - captured_at
              - received_at
              - relative_path
              - size_bytes
              - file_sha256
            properties:
              payload_id:
                type: string
                pattern: '^[a-f0-9]{64}$'
              kind:
                type: string
                enum: [metric, diagnostic]
              captured_at:
                type: string
                format: date-time
              received_at:
                type: string
                format: date-time
              relative_path:
                type: string
              size_bytes:
                type: integer
                format: int64
              file_sha256:
                type: string
                pattern: '^[a-f0-9]{64}$'
    TelemetryStatus:
      type: object
      required:
        - schema_version
        - generated_at
        - retention_days
        - max_total_bytes
        - total_bytes
        - total_count
        - metric_count
        - diagnostic_count
        - last_cleanup_count
        - last_confirmed_count
      properties:
        schema_version:
          type: integer
          enum: [1]
        generated_at:
          type: string
          format: date-time
        retention_days:
          type: integer
        max_total_bytes:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
        total_count:
          type: integer
        metric_count:
          type: integer
        diagnostic_count:
          type: integer
        oldest_received_at:
          type: string
          format: date-time
        newest_received_at:
          type: string
          format: date-time
        last_received_at:
          type: string
          format: date-time
        last_cleanup_at:
          type: string
          format: date-time
        last_cleanup_count:
          type: integer
        last_confirmed_at:
          type: string
          format: date-time
        last_confirmed_count:
          type: integer
    UpdateTimeline:
      type: object
      required: [version, branch, commits]
      properties:
        version:
          type: integer
          enum: [1]
        branch:
          type: string
          enum: [dev]
        commits:
          type: array
          items:
            $ref: '#/components/schemas/UpdateTimelineCommit'
    UpdateTimelineCommit:
      type: object
      required: [oid, message_headline, message, committed_at, url, ci_contexts]
      properties:
        oid:
          type: string
        message_headline:
          type: string
        message:
          type: string
        committed_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri
        ci_contexts:
          type: array
          items:
            type: string
    PublicAnnouncement:
      type: object
      required: [id, type, title, body]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [info, warning, blocking]
        min_build:
          type: string
        max_build:
          type: string
        language:
          type: string
        platform:
          type: string
          enum: [iOS, watchOS]
        title:
          type: string
        body:
          type: string
    AnnouncementRecordInput:
      allOf:
        - $ref: '#/components/schemas/PublicAnnouncement'
        - type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
    PublicSurvey:
      type: object
      required: [key, id, title, questions]
      properties:
        key:
          type: string
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        min_build:
          type: string
        max_build:
          type: string
        language:
          type: string
        platform:
          type: string
          enum: [iOS, watchOS]
        questions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/SurveyQuestion'
    SurveyQuestion:
      type: object
      required: [id, question, type, options]
      properties:
        id:
          type: string
        question:
          type: string
        type:
          type: string
          enum: [single_select, multi_select]
        allow_other:
          type: boolean
        required:
          type: boolean
        options:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/SurveyOption'
    SurveyOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
    SurveyRecordInput:
      allOf:
        - $ref: '#/components/schemas/PublicSurvey'
        - type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
    SurveyResponseInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [question_id]
            properties:
              question_id:
                type: string
              selected_option_ids:
                type: array
                items:
                  type: string
              other_text:
                type: string
                maxLength: 1000
        platform:
          type: string
          enum: [iOS, watchOS]
        app_version:
          type: string
          maxLength: 32
        app_build:
          type: string
          maxLength: 32
        language:
          type: string
          maxLength: 32
    PublicDistributionManifest:
      type: object
      required: [version, downloads]
      properties:
        version:
          type: integer
          enum: [1]
        downloads:
          type: array
          items:
            $ref: '#/components/schemas/PublicDistributionEntry'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/PublicDistributionAction'
    PublicDistributionEntry:
      type: object
      required: [name, path, url, file_name, sha256, size]
      properties:
        name:
          type: string
        path:
          type: string
          example: /Documents/Providers
        url:
          type: string
          example: /v1/distribution/files/0123456789abcdef/provider.json
        file_name:
          type: string
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        size:
          type: integer
          format: int64
          minimum: 1
    DistributionUpload:
      type: object
      required: [name, destination_path, enabled, file]
      properties:
        name:
          type: string
        destination_path:
          type: string
          example: /Documents/Providers
        enabled:
          type: boolean
        file:
          type: string
          format: binary
    DistributionUpdate:
      type: object
      required: [name, destination_path, enabled]
      properties:
        name:
          type: string
        destination_path:
          type: string
          example: /Documents/Providers
        enabled:
          type: boolean
        file:
          type: string
          format: binary
    PublicDistributionAction:
      type: object
      required: [id, revision, kind, apply_on, payload_url, payload_file_name, payload_sha256, payload_size, merge_policy]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [provider.upsert]
        apply_on:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [initial_sync, manual_sync]
        minimum_app_build:
          type: integer
          minimum: 0
        platforms:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ios, watchos]
        payload_url:
          type: string
        payload_file_name:
          type: string
        payload_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        payload_size:
          type: integer
          format: int64
          minimum: 1
        merge_policy:
          $ref: '#/components/schemas/OfficialProviderMergePolicy'
    OfficialProviderMergePolicy:
      type: object
      required: [provider_fields, api_keys, header_overrides, proxy_configuration, models, if_user_deleted]
      properties:
        provider_fields:
          type: string
          enum: [update_if_unmodified, server_wins, preserve_local]
        api_keys:
          type: string
          enum: [preserve_local_if_nonempty, server_wins, append_unique, update_if_unmodified]
        header_overrides:
          type: string
          enum: [update_if_unmodified, server_wins, preserve_local, merge_server_wins]
        proxy_configuration:
          type: string
          enum: [update_if_unmodified, server_wins, preserve_local]
        models:
          $ref: '#/components/schemas/OfficialProviderModelMergePolicy'
        if_user_deleted:
          type: string
          enum: [keep_deleted, restore_on_manual_sync, force_restore]
    OfficialProviderModelMergePolicy:
      type: object
      required: [fields, is_activated, on_missing, on_removed, user_models]
      properties:
        fields:
          type: string
          enum: [update_if_unmodified, server_wins, preserve_local]
        is_activated:
          type: string
          enum: [update_if_unmodified, server_wins, preserve_local]
        on_missing:
          type: string
          enum: [insert, skip]
        on_removed:
          type: string
          enum: [preserve, delete_if_unmodified]
        user_models:
          type: string
          enum: [preserve, delete]
    DistributionActionUpload:
      type: object
      required: [enabled, file]
      properties:
        enabled:
          type: boolean
        file:
          type: string
          format: binary
          description: schema_version 为 1 的 provider.upsert JSON 配方
    DistributionActionUpdate:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        file:
          type: string
          format: binary
